<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Principles Studio Live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Crect x='6' y='23' width='20' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='8' y='13' width='5' height='10' rx='1' fill='%23fff'/%3E%3Crect x='18' y='7' width='5' height='16' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a working bench. Left is the conversation with one expert; right is the Scribe's notebook that fills in as you talk. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#131A19; --muted:#55615E; --line:#CFD7D3; --grid:rgba(19,26,25,.055);
  --build:#A61E4D; --build-soft:#F9E3EB; --learn:#0B6E63; --learn-soft:#DDF1EE; --warn:#8A5200; --warn-soft:#FBEFD6;
  --good:#1D6B3A; --bad:#A3271F;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1413; --surface:#171D1C; --ink:#E8EEEB; --muted:#9BA8A3; --line:#2C3633; --grid:rgba(232,238,235,.05);
    --build:#F27FA6; --build-soft:#3A1826; --learn:#55D1BF; --learn-soft:#0F3530; --warn:#E6AE52; --warn-soft:#3A2A0C;
    --good:#6FD08F; --bad:#F08A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1413; --surface:#171D1C; --ink:#E8EEEB; --muted:#9BA8A3; --line:#2C3633; --grid:rgba(232,238,235,.05);
  --build:#F27FA6; --build-soft:#3A1826; --learn:#55D1BF; --learn-soft:#0F3530; --warn:#E6AE52; --warn-soft:#3A2A0C;
  --good:#6FD08F; --bad:#F08A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font:400 15px/1.5 var(--f-body)}
body[data-mode="build"]{--acc:var(--build);--acc-soft:var(--build-soft)}
body[data-mode="learn"]{--acc:var(--learn);--acc-soft:var(--learn-soft)}
.app{max-width:1280px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p,ul,ol{margin:0}
a{color:var(--acc);font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover:not(:disabled){border-color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--surface);font-weight:600}
button.quiet{border-color:transparent;background:none;color:var(--muted);padding:2px 6px;font-size:.85rem}
input,select,textarea{background:var(--bg);border:1px solid var(--line);padding:6px 8px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 auto;min-width:0}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar .logo{flex:none;border-radius:7px}
.modes{display:flex;border:1.5px solid var(--ink)}
.modes button{border:0;padding:6px 14px;font-family:var(--f-display);font-weight:700}
.modes button[aria-pressed="true"]{background:var(--acc);color:var(--surface)}
.status{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line);background:var(--surface);padding:2px 8px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:500}
.banner{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);padding:8px 12px}
.viewtabs{display:none}

/* two columns */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .viewtabs{display:flex;border:1px solid var(--line)}
  .viewtabs button{flex:1;border:0}
  .viewtabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
  body[data-view="talk"] #scribe,body[data-view="scribe"] #talk{display:none}
}

/* experts */
.tiles{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tile{flex:0 0 auto;width:104px;display:flex;flex-direction:column;gap:1px;padding:6px 8px;border-width:1.5px;text-align:left}
.tile .sym{font-family:var(--f-display);font-size:1.4rem;font-weight:700;line-height:1}
.tile .who{font-size:.8rem;font-weight:600;line-height:1.2}
.tile[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tile.new{border-style:dashed}
.lens{border-left:3px solid var(--acc);padding-left:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;border:1px dashed var(--muted);padding:12px}
.form label{display:flex;flex-direction:column;gap:2px}
.form .wide{grid-column:1/-1}

/* conversation */
.turns{display:flex;flex-direction:column;gap:12px;max-height:52vh;min-height:180px;overflow-y:auto;padding-right:4px}
.turn{display:flex;flex-direction:column;gap:2px;max-width:92%}
.turn p{white-space:pre-wrap}
.turn.you{align-self:flex-end;background:var(--acc-soft);padding:8px 12px}
.turn.ex{border-left:3px solid var(--ink);padding-left:12px}
.turn .head{display:flex;gap:8px;align-items:center}
.empty{display:flex;flex-direction:column;gap:10px;color:var(--muted)}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.composer{display:flex;flex-direction:column;gap:8px;border-top:1.5px solid var(--acc);padding-top:12px}
.composer textarea{min-height:64px;resize:vertical}
.mic[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.check{display:flex;gap:6px;align-items:center;font-size:.85rem}
.check input{width:auto}
.check select{width:auto}

/* scribe */
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{font-size:.85rem;padding:4px 10px}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.col,.stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.list{list-style:none;padding:0;display:flex;flex-direction:column;gap:5px}
.list li{padding-left:14px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:1.5px;background:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.card{border:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kv{display:flex;flex-direction:column;gap:4px}
.kvrow{display:flex;flex-direction:column;gap:2px}
.fit{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.badge{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;border:1px solid currentColor;padding:1px 8px;align-self:flex-start}
.badge.good{color:var(--good)} .badge.mid{color:var(--warn)} .badge.bad{color:var(--bad)}
.warnline{background:var(--warn-soft);border:1px solid var(--warn);padding:6px 10px;font-size:.88rem}
.graphbox{overflow-x:auto;border:1px solid var(--line);background:var(--bg);padding:8px}
.graphbox svg{display:block;margin:0 auto;height:auto}
.gedge{stroke:var(--muted);stroke-width:1.5;fill:none}
.garrow{fill:var(--muted)}
.gnode rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.gnode.assume rect{stroke:var(--warn);stroke-dasharray:5 3}
.gnode text{fill:var(--ink);font-family:var(--f-body);font-size:12px;font-weight:500;text-anchor:middle}
.gnode.pick{cursor:pointer}
.gnode.on rect{fill:var(--acc);stroke:var(--acc)}
.gnode.on text{fill:var(--surface)}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,76px) minmax(0,1fr) auto;gap:8px;align-items:end;border-top:1px solid var(--line);padding:10px 0}
.srow label{display:flex;flex-direction:column;gap:2px}
.srow input{font-variant-numeric:tabular-nums}
.srow .out{display:flex;flex-direction:column;gap:3px}
.srow .out b{font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums;line-height:1}
.barline{height:6px;background:var(--acc-soft)}
.barline i{display:block;height:100%;background:var(--acc)}
.srow .why{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
@media (max-width:700px){.srow{grid-template-columns:repeat(2,minmax(0,1fr))}.srow .name,.srow .out{grid-column:1/-1}}
pre.report{margin:0;white-space:pre-wrap;word-break:break-word;font:400 .8rem/1.5 var(--f-mono);border:1px solid var(--line);background:var(--bg);padding:12px;max-height:60vh;overflow:auto}
iframe.demo{width:100%;height:420px;border:1px solid var(--line);background:#fff}
.err{color:var(--bad)}

/* sessions */
.drawer{background:var(--surface);border:1.5px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:10px}
.sess{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0f766e"/><rect x="6" y="23" width="20" height="3" rx="1.5" fill="#fff"/><rect x="8" y="13" width="5" height="10" rx="1" fill="#fff"/><rect x="18" y="7" width="5" height="16" rx="1" fill="#fff"/></svg>
    <h1>First Principles Studio</h1>
    <div class="modes" role="group" aria-label="Room">
      <button id="m-build" aria-pressed="true">Build</button>
      <button id="m-learn" aria-pressed="false">Learn</button>
    </div>
    <span class="grow"></span>
    <button id="btn-new">New session</button>
    <button id="btn-sessions">Saved sessions</button>
    <button id="btn-settings" hidden>Settings</button>
  </header>
  <div class="status" id="status-chips" aria-live="polite"></div>
  <div class="banner" id="banner" hidden></div>

  <section class="drawer" id="drawer" hidden>
    <div class="row"><h2 class="grow">Saved sessions</h2><button id="btn-close-drawer">Close</button></div>
    <div id="sess-list" class="stack"></div>
  </section>

  <section class="drawer" id="settings" hidden>
    <div class="row"><h2 class="grow">Settings</h2><button id="btn-close-settings">Close</button></div>
    <p class="muted">This copy runs on its own, so it needs a brain. Pick one. Your choice is kept in this browser only.</p>
    <div class="form">
      <label class="wide"><span class="mono">Brain</span><select id="set-brain"><option value="ollama">Local model on this PC (Ollama): free and offline</option><option value="api">Claude through your own API key: online and paid per use</option><option value="gemini">Gemini through your own API key: online and paid per use</option></select></label>
      <label id="row-ollama-url"><span class="mono">Ollama address</span><input id="set-ollama-url" placeholder="http://localhost:11434"></label>
      <label id="row-ollama-model"><span class="mono">Ollama model</span><input id="set-ollama-model" placeholder="qwen3:14b"></label>
      <label id="row-api-key"><span class="mono">Claude API key</span><input id="set-api-key" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
      <label id="row-api-model"><span class="mono">Claude model</span><input id="set-api-model" placeholder="claude-sonnet-5-5"></label><label id="row-gemini-key" hidden><span class="mono">Gemini API key</span><input id="set-gemini-key" type="password" autocomplete="off" placeholder="AIza..."></label><label id="row-gemini-model" hidden><span class="mono">Gemini model</span><input id="set-gemini-model" placeholder="gemini-2.5-flash"></label>
      <div class="row wide"><button class="primary" id="set-save">Save</button><button id="set-test">Test the connection</button><span id="set-msg" class="muted" aria-live="polite"></span></div>
    </div>
    <p class="muted" id="set-help"></p>
  </section>

  <div class="viewtabs" role="group" aria-label="View">
    <button id="v-talk" aria-pressed="true">Talk</button>
    <button id="v-scribe" aria-pressed="false">Scribe</button>
  </div>

  <main class="grid">
    <section class="panel" id="talk">
      <div class="stack">
        <span class="mono">Pick your expert. You can switch at any point.</span>
        <div class="tiles" id="tiles"></div>
        <div class="lens" id="lens"></div>
        <div class="form" id="expert-form" hidden>
          <label><span class="mono">Name</span><input id="xf-name" maxlength="40" placeholder="Supply chain planner"></label>
          <label><span class="mono">Field</span><input id="xf-field" maxlength="80" placeholder="Cold chain logistics"></label>
          <label class="wide"><span class="mono">Starting principles</span><input id="xf-axioms" maxlength="240" placeholder="The few things this expert never argues with"></label>
          <label><span class="mono">Style</span><select id="xf-style"><option>Socratic</option><option>Blunt</option><option>Patient teacher</option></select></label>
          <label><span class="mono">Voice</span><select id="xf-voice"><option value="buttery">Buttery</option><option value="airy">Airy</option><option value="glassy">Glassy</option><option value="rounded">Rounded</option></select></label>
          <div class="row wide"><button class="primary" id="xf-save">Save expert</button><button id="xf-cancel">Cancel</button><span class="err" id="xf-err"></span></div>
        </div>
      </div>
      <div class="turns" id="turns" aria-live="polite"></div>
      <div class="composer">
        <textarea id="input" placeholder="Speak or type. Enter sends, Shift+Enter adds a line."></textarea>
        <div class="row">
          <button class="mic" id="btn-mic" aria-pressed="false" hidden>Speak</button>
          <button class="primary" id="btn-send">Send</button>
          <button id="btn-stop" hidden>Stop</button>
          <label class="check"><input type="checkbox" id="opt-speak" checked>Read answers aloud</label>
          <label class="check">Depth <select id="opt-depth"><option>Beginner</option><option selected>Working knowledge</option><option>Specialist</option></select></label>
        </div>
        <span class="muted" id="state" aria-live="polite"></span>
      </div>
    </section>

    <section class="panel" id="scribe">
      <div class="row"><h2 class="grow" id="scribe-title">The Scribe's notebook</h2><span class="mono" id="scribe-state"></span></div>
      <div class="tabs" id="tabs"></div>
      <div class="stack" id="pane"></div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
